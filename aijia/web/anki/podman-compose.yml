version: "3.9"

networks:
  local_containers:
    external: true

services:
  anki-sync:
    container_name: anki-sync
    image: honbey/anki-sync:26.8.8-39e4b0b4
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SYNC_USER1: ${SYNC_USER1}
    volumes:
      - ./data:/data:U,Z
    ports:
      - 0.0.0.0:1105:8080
    networks:
      local_containers:
        ipv4_address: 10.25.11.5
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 256M
        reservations:
          cpus: 0.1
          memory: 16M
    logging:
      driver: journald

    healthcheck:
      test:
        [
          "CMD",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
