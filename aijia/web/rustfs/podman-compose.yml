version: "3.9"

networks:
  local_containers:
    external: true

services:
  rustfs:
    container_name: rustfs
    image: rustfs/rustfs:1.0.0-rc.2
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-zhang}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CONSOLE_ADDRESS: ${RUSTFS_CONSOLE_ADDRESS:-0.0.0.0:9001}
      RUSTFS_CORS_ALLOWED_ORIGINS: ${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: ${RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS:-*}
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ./data:/data:U,Z
    ports:
      - 1110:9000
      - 1111:9001
    networks:
      local_containers:
        ipv4_address: 10.25.11.10
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 2G
        reservations:
          cpus: 0.1
          memory: 32M
    logging:
      driver: k8s-file
      options:
        max-size: 10M

    healthcheck:
      test: ["CMD", "curl", "-f", "http://rustfs:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

