server:
  name: mcp-mytools
  transport: http
  host: 0.0.0.0
  port: 1182

tools:
  ls:
    path: /bin/ls
    description: "List directory contents"
    default_args: ["-la"]
  git:
    path: /usr/bin/git
    description: "Git operations"
    default_args: []
    allowed_subcommands:
      - status
      - diff
      - log
      - branch
      - shortlog
      - show
      - pull
    allowed_branches:
      - main
      - master
  podman:
    path: /usr/bin/podman
    description: "Podman container management"
    default_args: []
    allowed_subcommands:
      - ps
      - run
      - start
      - stop
  podman-compose:
    path: /usr/bin/podman-compose
    description: "Podman compose operations"
    default_args: []
    allowed_subcommands:
      - up
      - down
      - start
      - stop
  tmux:
    path: /home/zhang/.local/bin/tmux
    description: "Tmux session and window management (create/send/capture/create_window/kill_window/list_window)"
    default_args: []
    allowed_commands:
      - name: cmake_llamacpp
        command: cmake -B build -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release -DLLAMA_BUILD_UI=OFF -DLLAMA_USE_PREBUILT_UI=OFF && cmake --build build -j8
      - name: run_llama_server
        command: ./build/bin/llama-server -m ${HOME}/resources/models/Qwen3.5-4B-MTP-Q4_K_M.gguf --host 0.0.0.0 --port 1300 -ngl 99 --flash-attn 1 --temp 0.7 --top-p 0.95 --reasoning on --reasoning-budget 2048 --reasoning-budget-message "... The thinking process has reached its length limit; I will now stop thinking and respond." --ctx-size 20480 --alias 'qwen3.5:4b' --cache-type-k q4_0 --cache-type-v q4_0 --mmproj ${HOME}/resources/models/qwen-mmproj-BF16.gguf --no-mmproj-offload --spec-type draft-mtp --spec-draft-n-max 2 --cache-ram 2048

allowed_folders:
  - name: dotfiles
    folder: /home/zhang/dotfiles/**
  - name: llamacpp
    folder: /home/zhang/app/ai/llama.cpp/**

execution:
  timeout_seconds: 30
  max_output_bytes: 10240
