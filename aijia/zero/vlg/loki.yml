---
auth_enabled: true

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache
    cache_ttl: 24h

query_range:
  cache_results: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 12h
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

# https://grafana.com/docs/loki/latest/configure/bp-configure/
ingester:
  # Chunk settings
  chunk_idle_period: 30m
  chunk_target_size: 1572864 # 1.5 MB
  chunk_encoding: snappy
  max_chunk_age: 2h

  # WAL settings
  wal:
    enabled: true
    dir: /loki/wal
    checkpoint_duration: 5m
    flush_on_shutdown: true

limits_config:
  retention_period: 744h
  max_query_lookback: 744h
  #per_tenant_override_config: /etc/loki/overrides.yml

  # Rate limits
  ingestion_rate_strategy: global
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB

  # Stream limits
  max_global_streams_per_user: 10000
  max_streams_per_user: 0

  # Validation
  max_line_size: 256KB
  max_line_size_truncate: false
  max_label_name_length: 1024
  max_label_value_length: 2048
  max_label_names_per_series: 15

  # Time constraints
  reject_old_samples: true
  reject_old_samples_max_age: 168h # 7 days
  creation_grace_period: 10m
  unordered_writes: true

# https://grafana.com/docs/loki/latest/configure/usage-statistics/
analytics:
  reporting_enabled: false
