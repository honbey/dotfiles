version: "3.9"

networks:
  local_containers:
    external: true

services:
  authelia:
    container_name: authelia
    image: authelia/authelia:master
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: "/config/secrets/JWT_SECRET"
      #AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: "/config/secrets/LDAP_PASSWORD"
      AUTHELIA_SESSION_SECRET_FILE: "/config/secrets/SESSION_SECRET"
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: "/config/secrets/STORAGE_ENCRYPTION_KEY"
      AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: "/config/secrets/SMTP_PASSWORD"
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: "/config/secrets/HMAC_SECRET"
    volumes:
      - ./data:/data:U,Z
      - ./config:/config:U,Z
    ports:
      - 127.0.0.1:1099:9091
    networks:
      local_containers:
        ipv4_address: 10.25.1.109
    deploy:
      resources:
        limits:
          cpus: 2
          memory: 1G
        reservations:
          cpus: 0.1
          memory: 32M
    logging:
      driver: k8s-file
      options:
        max-size: 10M
