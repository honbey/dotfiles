# /etc/sysctl.d/99-tuning_server.conf

# === File Handles and Resource Limits ===
# Maximum global file handles, supporting massive concurrent connections
fs.file-max = 2097152

# Maximum open file limit per process
fs.nr_open = 2097152

# Maximum system PID limit, must be large enough for high‑concurrency services (including containers)
kernel.pid_max = 4194304

# inotify watch limit, increase for containers monitoring many files (default 8192 is easily exhausted)
fs.inotify.max_user_watches = 524288

# User namespace limit, sufficient for container runtime
user.max_user_namespaces = 15000

# === Memory Management ===
# Reduce Swap usage tendency (0~100, lower means less inclined to swap), recommended 1~10 for database servers
vm.swappiness = 10

# Slow down dentry/inode cache reclamation, improving file path lookup efficiency (default 100, lower to 50 for high‑IO services)
vm.vfs_cache_pressure = 50

# Dirty page background flush threshold (percentage), background async flush avoids IO blocking
vm.dirty_background_ratio = 5

# Dirty page absolute limit (percentage), forces synchronous flush when reached (may increase to 10~20 for SSDs)
vm.dirty_ratio = 10

# Minimum reserved free memory (KB), prevents system freeze under OOM
vm.min_free_kbytes = 262144

# Memory overcommit policy: 0=heuristic (default), 1=always allow, 2=deny overcommit
# For memory‑sensitive applications like databases, 2 is recommended, used with overcommit_ratio for precise control
vm.overcommit_memory = 1

# === Networking Core ===
# Maximum length of the fully established connection queue, must be increased for high‑concurrency web services
net.core.somaxconn = 65535

# Maximum receive queue length per NIC, handles traffic spikes
net.core.netdev_max_backlog = 5000

# Maximum length of the TCP SYN queue
net.ipv4.tcp_max_syn_backlog = 16384

# Maximum receive/send buffer sizes (bytes), works with TCP window auto‑scaling
net.core.rmem_max = 25165824
net.core.wmem_max = 25165824

# === TCP Stack ===
# Enable TCP window auto‑scaling
net.ipv4.tcp_window_scaling = 1

# TCP read/write buffers (min default max), system allocates dynamically as needed
net.ipv4.tcp_rmem = 4096 65536 25165824
net.ipv4.tcp_wmem = 4096 65536 25165824

# Enable reuse of TIME‑WAIT sockets (for client side), alleviates port exhaustion
net.ipv4.tcp_tw_reuse = 1

# Reduce FIN‑WAIT‑2 timeout (default 60s), accelerates port recycling
net.ipv4.tcp_fin_timeout = 30

# Maximum number of TIME‑WAIT sockets, destroys excess directly
net.ipv4.tcp_max_tw_buckets = 5000

# Enable TCP Fast Open (3 = both client and server enabled), reduces RTT for first HTTP request
net.ipv4.tcp_fastopen = 3

# TCP keepalive parameters: reduce probe intervals to release dead connections faster
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 3

# Expand local port range to avoid port exhaustion under high‑concurrency short‑lived connections
net.ipv4.ip_local_port_range = 1024 65535

# Enable BBR congestion control (kernel support required, Linux 4.9+), improves throughput and lowers latency
net.ipv4.tcp_congestion_control = bbr

# Queueing discipline that works with BBR
net.core.default_qdisc = fq

# === Kernel Security Hardening ===
# Enable TCP SYN Cookies, defends against SYN Flood attacks
net.ipv4.tcp_syncookies = 1

# Enable reverse path filtering, prevents IP spoofing
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable acceptance of source‑routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Disable acceptance of ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# Enable logging of Martian source addresses (logs suspicious packets)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore ICMP broadcast echo requests, prevents Smurf attacks
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Do not respond to ICMP Echo requests (enable as needed to hide server presence)
net.ipv4.icmp_echo_ignore_all = 1

# IPv6 security hardening
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Restrict exposure of kernel pointers (e.g., /proc/kallsyms), default 2 = fully hidden
kernel.kptr_restrict = 2

# Restrict dmesg access, non‑root users cannot read kernel logs (prevents info leaks)
kernel.dmesg_restrict = 1

# Disable unprivileged BPF usage (prevents eBPF‑related attacks)
kernel.unprivileged_bpf_disabled = 1

# Harden BPF JIT engine (supported only on some architectures)
net.core.bpf_jit_harden = 2

# Enable ASLR (Address Space Layout Randomization), 2 = full randomization
kernel.randomize_va_space = 2

# Disable unprivileged user namespace creation (set to 0 if containers are not needed on the host)
kernel.unprivileged_userns_clone = 1

# === Other ===
net.ipv4.ip_unprivileged_port_start=33
