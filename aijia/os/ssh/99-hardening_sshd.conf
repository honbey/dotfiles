# /etc/ssh/sshd_config.d/99-hardening_sshd.conf

# SSH Security Hardening Configuration

# === Network and Port ===
# Change default SSH port (reduce noise, mitigate/filter automated scanning)
Port 8989

# Listen only on specified IPv4 address (recommend binding to internal management NIC) to prevent direct external scanning
ListenAddress 0.0.0.0

# === Authentication Methods ===
# Disable direct root login
PermitRootLogin no

# Enable public key authentication
PubkeyAuthentication yes

# Disable password authentication
PasswordAuthentication no

# Disable keyboard-interactive authentication
ChallengeResponseAuthentication no

# Disable GSSAPI authentication (if Kerberos is not needed)
GSSAPIAuthentication no

# Specify authorized_keys file path
AuthorizedKeysFile .ssh/authorized_keys

# === Connection Limits and Rate Control ===
# Maximum authentication attempts, disconnect after exceeding
MaxAuthTries 3

# Maximum simultaneous unauthenticated connections (start:rate:full), limits the number of unauthenticated connections and gradually rejects further attempts
MaxStartups 10:30:60

# Login grace time (seconds), disconnect if authentication not completed within this time (mitigates CVE-2025-26466 memory consumption)
LoginGraceTime 30s

# Maximum concurrent sessions (optional, limits multiplexing per connection)
MaxSessions 6

# === Protocol and Algorithm Hardening ===
# Use only SSH protocol v2
Protocol 2

# Client keepalive interval (seconds), reduces zombie connections
ClientAliveInterval 300

# Maximum number of unresponsive client probes, disconnect after exceeding
ClientAliveCountMax 2

# === Performance Optimization ===
# Disable DNS reverse lookup to speed up login (especially in internal networks)
UseDNS no

# Disable TCP forwarding (remove if port forwarding is needed)
# AllowTcpForwarding no
AllowTcpForwarding yes

# Disable X11 forwarding (not needed for web/database servers)
X11Forwarding no

# If SFTP file transfer is needed, keep this feature and comment out the next line
# Subsystem sftp internal-sftp

# === Access Control ===
# Allow only specified users (recommended)
AllowUsers zhang

# Or allow only specified groups (mutually exclusive with AllowUsers)
# AllowGroups ssh-users wheel

# Disallow empty password login
PermitEmptyPasswords no

# Disable .rhosts and host-based authentication (only keys + PAM)
HostbasedAuthentication no
IgnoreRhosts yes

# === Logging ===
# Log level (VERBOSE logs login fingerprints for auditing)
LogLevel VERBOSE
